name: Docs CI

# STUB for merge-queue testing (kvac-mergequeue-test only).
# Real repo runs the heavy Verso+blueprint build here; this stub is fast so we
# can exercise the merge queue's gating without compiling anything. It triggers
# on merge_group (the queue candidate) and fails iff docs/FAIL_MARKER exists, so
# a test PR can force either outcome.
on:
  merge_group:

jobs:
  docs:
    name: Build docs and check declaration coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stub docs check
        run: |
          if [ -f docs/FAIL_MARKER ]; then
            echo "FAIL_MARKER present on the merge candidate — failing the docs check"
            exit 1
          fi
          echo "docs check passed (stub)"
