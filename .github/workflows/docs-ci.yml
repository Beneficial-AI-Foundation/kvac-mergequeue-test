name: Docs CI

# Merge-time doc generation (the #102 intent), stubbed for kvac-mergequeue-test.
#
# The docs build runs ONLY on `merge_group` — i.e. on the merge queue's
# candidate commit, not on every push to every PR. Set as a required check for
# the queue, a failing docs build fails the merge candidate and the PR is
# dropped, so `main` never receives docs that do not build. No `pull_request`
# trigger: authors get no per-push docs run (the cost saving), and the gate
# moves to merge time.
#
# The real repo runs the Verso + blueprint build here. This stub is fast: it
# fails iff `docs/FAIL_MARKER` exists on the merge candidate.
on:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Build docs and check declaration coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build docs and check coverage (stub)
        run: |
          if [ -f docs/FAIL_MARKER ]; then
            echo "FAIL_MARKER present on the merge candidate -> failing the docs check"
            exit 1
          fi
          echo "docs check passed (stub)"
